<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Parkimi</title>
<style>
:root{--bg:#0c0c0d;--p:#161618;--p2:#212125;--b:#303035;--t:#f4f2ea;--m:#9b9a92;--y:#ffc400;--r:#ff3b30;--g:#2fd07a;--asp:#23262d}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 "Segoe UI Variable",Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;position:sticky;top:0;background:rgba(12,12,13,.92);backdrop-filter:blur(8px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-size:1.15rem;font-weight:700}
.logo{width:38px;height:38px;border-radius:10px;background:var(--y);color:#111;display:grid;place-items:center;font-weight:900;font-size:1.3rem;box-shadow:inset 0 0 0 3px #111}
.hrs{font-size:.8rem;color:var(--m);text-align:right;line-height:1.3}.hrs b{color:var(--y)}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,#111 14px 28px)}
main{max-width:1100px;margin:0 auto;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:12px 14px}.kpi b{display:block;font-size:1.7rem;line-height:1.1}.kpi span{color:var(--m);font-size:.8rem}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--b);background:var(--p);cursor:pointer}.tab.on{background:var(--y);color:#111;border-color:var(--y);font-weight:700}
.lot{background:var(--asp);border:6px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--y) 0 14px,#111 14px 28px) 6;padding:20px 10px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.stall{position:relative;aspect-ratio:3/5;min-height:118px;border-left:3px solid var(--t);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:6px 2px;transition:background .3s}
.row .stall:last-child{border-right:3px solid var(--t)}
#rt .stall{border-top:3px solid var(--y)}#rb .stall{border-bottom:3px solid var(--y);justify-content:flex-end}
.stall.free{background:linear-gradient(rgba(47,208,122,.22),rgba(47,208,122,.04))}
.stall.reserved{background:linear-gradient(rgba(255,196,0,.28),rgba(255,196,0,.05))}
.stall.occupied{background:linear-gradient(rgba(255,59,48,.14),transparent)}
.stall:hover{outline:2px solid rgba(255,196,0,.7);outline-offset:-2px}
.id{position:relative;z-index:2;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.6)}
.free .id{background:var(--g);color:#06210f}.reserved .id{background:var(--y);color:#111}.occupied .id{background:var(--r)}
.p{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:2.4rem;font-weight:800;color:var(--t);opacity:.5}
.p small{font-size:.7rem;font-weight:600;line-height:1.2;color:var(--y);opacity:1}
.mv{position:absolute;inset:0}.mv.in{animation:drv 1.2s ease-out both}
@keyframes drv{from{transform:translateY(var(--dy))}to{transform:none}}
.car{position:absolute;left:50%;top:50%;height:80%;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 5px rgba(0,0,0,.55))}
.car.truck{height:96%}
#rb .car{transform:translate(-50%,-50%) rotate(180deg)}
.lane{height:62px;margin:14px 0;position:relative;display:flex;align-items:center;justify-content:space-around;color:var(--t)}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:8px;transform:translateY(-50%);border-top:3px dashed var(--y);border-bottom:3px dashed var(--y)}
.lane span{position:relative;background:var(--asp);padding:0 12px;font-size:1.4rem;opacity:.85}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--m);font-size:.82rem}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
footer{max-width:1100px;margin:0 auto;padding:6px 18px 30px;color:var(--m);font-size:.82rem}footer a{color:var(--m);margin-right:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden],[hidden]{display:none!important}
.card{width:min(480px,100%);max-height:94vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:22px 22px 0 0;padding:26px 20px calc(20px + env(safe-area-inset-bottom));position:relative}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,#111 14px 28px)}
@media(min-width:700px){.sheet{align-items:center}.card{border-radius:22px}}
.x{position:absolute;right:12px;top:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--b);background:var(--p2);cursor:pointer;font-size:1.2rem}
.card h3{font-size:1.25rem;margin-bottom:12px}
.mrow{display:flex;gap:14px;margin-bottom:12px}.info p{margin-top:6px;font-size:.9rem}
.qr{background:#fff;padding:7px;border-radius:10px;width:104px;height:104px;flex-shrink:0;line-height:0}.qr svg{width:100%;height:100%}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:.8rem}.pill.g{background:var(--g);color:#06210f}.pill.y{background:var(--y);color:#111}.pill.r{background:var(--r)}
.sl{font-size:.82rem;color:var(--m);margin-bottom:12px;background:var(--p2);border-radius:12px;padding:10px 12px}.sl div{color:var(--t);margin-top:3px}
.tk{background:var(--p2);border:1px solid var(--y);border-radius:14px;padding:14px;display:grid;gap:10px}
.note{background:var(--p2);border-radius:12px;padding:12px;color:var(--m)}
.f{display:grid;gap:12px}.f label{display:grid;gap:5px;font-size:.8rem;color:var(--m)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--b);background:var(--p2)}
input[type=range]{padding:0;accent-color:var(--y)}.dl{color:var(--t);font-size:.95rem;font-weight:600}
.err{color:var(--r);font-size:.85rem;min-height:1.2em}
.btn{padding:14px;border-radius:12px;border:0;background:var(--y);color:#111;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--p2);color:var(--t);border:1px solid var(--b)}.btn:disabled{opacity:.4;cursor:not-allowed}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pc{background:#fff;color:#111;border:3px solid #111;border-radius:12px;padding:12px;text-align:center}.pc b{font-size:1.5rem;display:block}.pc small{display:block;color:#444}
.pc .qr{margin:8px auto;width:140px;height:140px;padding:0}
.tw{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:.84rem}.tbl th,.tbl td{padding:8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
.ar{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}.ar input{max-width:260px}.ar .btn{width:auto;padding:12px 18px}
@media(max-width:600px){.stall{min-height:84px}.p{font-size:1.5rem}.id{font-size:.62rem;padding:1px 5px}main{padding:12px}.lot{padding:14px 4px}}
@media print{.bar,.hazard,footer,.noprint{display:none}body{background:#fff}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="#"><span class="logo">P</span>Parkimi</a>
  <div class="hrs" id="hrs">Duke u ngarkuar…</div>
</header>
<div class="hazard"></div>

<main>
  <section id="v-lot">
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div class="lot" id="lot">
      <div class="row" id="rt"></div>
      <div class="lane"><span>➜</span><span>➜</span><span>➜</span><span>➜</span></div>
      <div class="row" id="rb"></div>
    </div>
    <div class="legend"><span><i style="background:var(--g)"></i>I lirë</span><span><i style="background:var(--y)"></i>Rezervuar</span><span><i style="background:var(--r)"></i>I zënë</span></div>
  </section>

  <section id="v-print" hidden>
    <div class="ar noprint"><button class="btn" onclick="print()">Printo QR kodet</button></div>
    <div class="pgrid" id="pgrid"></div>
  </section>

  <section id="v-admin" hidden>
    <h3>Regjistri i parkimeve</h3>
    <div class="ar"><input id="ak" type="password" placeholder="Çelësi i adminit" autocomplete="off"><button class="btn" onclick="loadAdmin()">Ngarko</button><button class="btn sec" onclick="csv()">Shkarko CSV</button></div>
    <div class="err" id="aerr"></div>
    <div class="tw"><table class="tbl" id="atbl"></table></div>
  </section>
</main>
<footer><a href="#print">Printo QR kodet</a><a href="#admin">Admin</a></footer>

<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = { g: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, s: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };
const ids = (p, a, b) => Array.from({ length: b - a + 1 }, (_, i) => `${p}-P${a + i}`);
const SECT = { A: { name: "Sektori A", top: ids("A", 1, 5), bot: ids("A", 6, 10) }, B: { name: "Sektori B", top: ids("B", 1, 6), bot: ids("B", 7, 12) } };
const VEH = { mercedes: "Mercedes", vw: "Volkswagen", bmw: "BMW", audi: "Audi", porsche: "Porsche", kamion: "Kamion", tjeter: "Tjetër" };
const STEP = 9e5;
let S = null, skew = 0, sect = "A", cur = null, mv = {}, prev = {}, uid = 0, adminRows = [];
let mine = []; try { mine = JSON.parse(ls.g("parkimi_mine") || "[]"); } catch (_) {}
const now = () => Date.now() + skew;
const tf = t => new Intl.DateTimeFormat("sq-AL", { hour: "2-digit", minute: "2-digit", timeZone: S.tz }).format(t);
const dur = m => { const h = Math.floor(m / 60), r = m % 60; return (h ? h + " orë" : "") + (h && r ? " " : "") + (r ? r + " min" : ""); };
const qr = t => { try { const q = qrcode(0, "M"); q.addData(t); q.make(); return q.createSvgTag(4, 0); } catch (_) { return ""; } };
const url = k => location.origin + location.pathname + "#" + k;

/* ---------- automjetet (pamje nga sipër, SVG) ---------- */
const CAR = {
  mercedes: { w: 44, y: [4, 116], g: [38, 86], r: 18, c: ["#c7ccd4", "#1b1e25", "#eef0f3"] },
  vw: { w: 42, y: [12, 108], g: [32, 90], r: 20, c: ["#2a5db0", "#e9ecef", "#b22222"] },
  bmw: { w: 44, y: [4, 116], g: [40, 84], r: 13, c: ["#23406e", "#15171c", "#d9dde3"] },
  audi: { w: 44, y: [4, 116], g: [34, 100], r: 11, c: ["#6b727d", "#a3202a", "#101114"] },
  porsche: { w: 48, y: [8, 112], g: [46, 82], r: 24, c: ["#f2b705", "#b3141c", "#aeb4bd"] },
  tjeter: { w: 42, y: [8, 112], g: [36, 88], r: 16, c: ["#4f7a62", "#7a5230", "#585e69"] }
};
function carSvg(v, seed) {
  if (v === "kamion") {
    const c = ["#c0262d", "#2a5db0", "#e9ecef"][seed % 3];
    return `<svg class="car truck" viewBox="0 0 60 170"><rect x="1" y="14" width="8" height="20" rx="3" fill="#090a0c"/><rect x="51" y="14" width="8" height="20" rx="3" fill="#090a0c"/><rect x="1" y="110" width="8" height="24" rx="3" fill="#090a0c"/><rect x="51" y="110" width="8" height="24" rx="3" fill="#090a0c"/><rect x="1" y="138" width="8" height="24" rx="3" fill="#090a0c"/><rect x="51" y="138" width="8" height="24" rx="3" fill="#090a0c"/>
    <rect x="7" y="52" width="46" height="114" rx="4" fill="#dfe3e8"/>${[66, 80, 94, 108, 122, 136, 150].map(y => `<rect x="7" y="${y}" width="46" height="2" fill="#aab1ba"/>`).join("")}
    <rect x="9" y="3" width="42" height="46" rx="10" fill="${c}"/><rect x="13" y="11" width="34" height="13" rx="4" fill="#0d1521"/><rect x="14" y="30" width="32" height="12" rx="4" fill="#fff" opacity=".18"/><rect x="5" y="14" width="4" height="9" rx="2" fill="${c}"/><rect x="51" y="14" width="4" height="9" rx="2" fill="${c}"/><rect x="13" y="4" width="8" height="3" rx="1.5" fill="#fff6cf"/><rect x="39" y="4" width="8" height="3" rx="1.5" fill="#fff6cf"/></svg>`;
  }
  const m = CAR[v] || CAR.tjeter, c = m.c[seed % m.c.length], x = 30 - m.w / 2, [y1, y2] = m.y, [g1, g2] = m.g, h = y2 - y1, id = "g" + (++uid);
  const body = `x="${x}" y="${y1}" width="${m.w}" height="${h}" rx="${m.r}"`;
  return `<svg class="car" viewBox="0 0 60 120"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".35" stop-color="#fff" stop-opacity=".24"/><stop offset=".65" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></linearGradient></defs>
  ${[[1, y1 + 14], [51, y1 + 14], [1, y2 - 34], [51, y2 - 34]].map(([a, b]) => `<rect x="${a}" y="${b}" width="8" height="20" rx="3" fill="#090a0c"/>`).join("")}
  <rect ${body} fill="${c}"/><rect ${body} fill="url(#${id})"/>
  <rect x="${x + 4}" y="${g1}" width="${m.w - 8}" height="${g2 - g1}" rx="8" fill="#0d1521"/>
  <rect x="${x + 7}" y="${g1 + 13}" width="${m.w - 14}" height="${g2 - g1 - 24}" rx="6" fill="${c}"/><rect x="${x + 7}" y="${g1 + 13}" width="${m.w - 14}" height="${g2 - g1 - 24}" rx="6" fill="url(#${id})"/>
  <rect x="${x - 2}" y="${g1 + 4}" width="4" height="8" rx="2" fill="${c}"/><rect x="${x + m.w - 2}" y="${g1 + 4}" width="4" height="8" rx="2" fill="${c}"/>
  <rect x="${x + 5}" y="${y1 + 2}" width="10" height="4" rx="2" fill="#fff6cf"/><rect x="${x + m.w - 15}" y="${y1 + 2}" width="10" height="4" rx="2" fill="#fff6cf"/>
  <rect x="${x + 5}" y="${y2 - 6}" width="10" height="4" rx="2" fill="#ff2b2b"/><rect x="${x + m.w - 15}" y="${y2 - 6}" width="10" height="4" rx="2" fill="#ff2b2b"/></svg>`;
}

/* ---------- harta ---------- */
function stall(k, rev) {
  const o = S.spots[k], m = mv[k], n = now(), an = m && n - m.t < 1300, num = k.split("P")[1];
  const inner = o.status === "occupied"
    ? `<div class="mv${an ? " in" : ""}" style="--dy:${rev ? "-170%" : "170%"}${an ? `;animation-delay:-${((n - m.t) / 1000).toFixed(2)}s` : ""}">${carSvg(o.vehicle, +num)}</div>`
    : `<div class="p">${o.status === "reserved" ? `<small>Rezervuar<br>${tf(o.start)}</small>` : "P"}</div>`;
  return `<div class="stall ${o.status}" data-k="${k}">${inner}<span class="id">P${num}</span></div>`;
}
function render() {
  const t = now(), open = t >= S.open && t < S.close, all = Object.values(S.spots), c = s => all.filter(o => o.status === s).length;
  $("#hrs").innerHTML = `Hapur <b>${tf(S.open)}–${tf(S.close)}</b><br>${open ? "Hapur tani" : t < S.open ? "Hapet në " + tf(S.open) : "Mbyllur për sot"}`;
  $("#kpis").innerHTML = `<div class="kpi"><b style="color:var(--g)">${c("free")}</b><span>Vende të lira</span></div><div class="kpi"><b style="color:var(--y)">${c("reserved")}</b><span>Rezervuar</span></div><div class="kpi"><b style="color:var(--r)">${c("occupied")}</b><span>Të zëna</span></div>`;
  $("#tabs").innerHTML = Object.keys(SECT).map(k => `<button class="tab${k === sect ? " on" : ""}" data-s="${k}">${SECT[k].name} · ${[...SECT[k].top, ...SECT[k].bot].filter(x => S.spots[x].status === "free").length} të lira</button>`).join("");
  $("#rt").innerHTML = SECT[sect].top.map(k => stall(k, false)).join("");
  $("#rb").innerHTML = SECT[sect].bot.map(k => stall(k, true)).join("");
}
$("#tabs").onclick = e => { const b = e.target.closest(".tab"); if (b) { sect = b.dataset.s; render(); } };
$("#lot").onclick = e => { const s = e.target.closest(".stall"); if (s) openSheet(s.dataset.k); };

/* ---------- dritarja e vendit ---------- */
function openSheet(k) { cur = k; history.replaceState(null, "", "#" + k); $("#sheet").hidden = false; drawSheet(); }
function closeSheet() { cur = null; $("#sheet").hidden = true; history.replaceState(null, "", location.pathname); }
$("#sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };

function nextStart(o, st) { const n = o.slots.map(s => s.s).filter(s => s > st); return Math.min(S.close, ...n); }
function slotOpts(o) {
  const t = now(), out = [], busy = x => o.slots.some(s => x >= s.s && x < s.e);
  if (t >= S.open && t < S.close - STEP && !busy(t)) out.push(`<option value="now">Tani (${tf(t)})</option>`);
  let x = t < S.open ? S.open : S.open + Math.ceil((t - S.open) / STEP) * STEP;
  for (; x <= S.close - STEP; x += STEP) if (!busy(x)) out.push(`<option value="${x}">${tf(x)}</option>`);
  return out.join("");
}
function upd() {
  const o = S.spots[cur], sel = $("#st").value, st = sel === "now" ? now() : +sel;
  if (!sel) { $("#bk").disabled = true; return; }
  const mx = Math.min(S.max, Math.floor((nextStart(o, st) - st) / STEP) * 15), d = $("#du");
  d.max = Math.max(15, mx); if (+d.value > mx) d.value = Math.max(15, mx);
  $("#dl").textContent = `${dur(+d.value)} · deri në ${tf(st + d.value * 6e4)}`;
  $("#bk").disabled = mx < 15; $("#bk").textContent = sel === "now" ? "Fillo parkimin" : "Rezervo vendin";
}
function drawSheet() {
  if (!cur || !S) return;
  const o = S.spots[cur], t = now(), [sc, pn] = cur.split("-"), my = o.slots.find(s => mine.some(b => b.id === s.id));
  const st = o.status === "occupied" ? `<span class="pill r">I zënë</span><p>${VEH[o.vehicle] || ""} · ${esc(o.name)}</p><p>Deri në <b>${tf(o.end)}</b> (edhe ${Math.max(1, Math.ceil((o.end - t) / 6e4))} min)</p>`
    : o.status === "reserved" ? `<span class="pill y">Rezervuar</span><p>Nga ${tf(o.start)} deri në ${tf(o.end)}</p>` : `<span class="pill g">I lirë</span><p>Skano ose zgjidh orarin më poshtë.</p>`;
  let h = `<button class="x" onclick="closeSheet()" aria-label="Mbyll">×</button><h3>${SECT[sc].name} · ${pn}</h3><div class="mrow"><div class="qr">${qr(url(cur))}</div><div class="info">${st}</div></div>`;
  if (o.slots.length) h += `<div class="sl">Orari i zënë sot${o.slots.map(s => `<div>${tf(s.s)}–${tf(s.e)} · ${esc(s.n)}</div>`).join("")}</div>`;
  if (my) {
    h += `<div class="tk"><b>Rezervimi yt</b><div>${my.s > t ? `Fillon në <b>${tf(my.s)}</b>` : `Ka mbetur <b>${Math.max(1, Math.ceil((my.e - t) / 6e4))} min</b>`}, deri në <b>${tf(my.e)}</b></div><button class="btn sec" onclick="endMine(${my.id})">${my.s > t ? "Anulo rezervimin" : "Përfundo parkimin"}</button></div>`;
  } else if (t >= S.close) {
    h += `<div class="note">Parkingu është mbyllur për sot. Hapet nesër në ${tf(S.open)}.</div>`;
  } else if (!slotOpts(o)) {
    h += `<div class="note">Nuk ka orar të lirë për sot në këtë vend. Provo një vend tjetër.</div>`;
  } else {
    let u = {}; try { u = JSON.parse(ls.g("parkimi_user") || "{}"); } catch (_) {}
    h += `<form class="f" onsubmit="book(event)"><label>Emri dhe mbiemri<input id="nm" autocomplete="name" maxlength="40" required value="${esc(u.n || "")}"></label>
    <label>Numri i telefonit<input id="ph" type="tel" autocomplete="tel" placeholder="+383 4X XXX XXX" required value="${esc(u.p || "")}"></label>
    <label>Automjeti<select id="vh">${Object.entries(VEH).map(([k, v]) => `<option value="${k}"${u.v === k ? " selected" : ""}>${v}</option>`).join("")}</select></label>
    <label>Fillimi<select id="st" onchange="upd()">${slotOpts(o)}</select></label>
    <label>Kohëzgjatja (${S.min} min – ${dur(S.max)})<input id="du" type="range" min="15" max="${S.max}" step="15" value="60" oninput="upd()"><span class="dl" id="dl"></span></label>
    <div class="err" id="err"></div><button class="btn" id="bk">Konfirmo</button></form>`;
  }
  $("#card").innerHTML = h;
  if ($("#st")) upd();
}
async function book(e) {
  e.preventDefault();
  const sel = $("#st").value, start = sel === "now" ? now() : +sel, n = $("#nm").value.trim(), p = $("#ph").value.trim(), v = $("#vh").value;
  $("#bk").disabled = true;
  try {
    const r = await fetch("/api/book", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ spot: cur, name: n, phone: p, vehicle: v, start, minutes: +$("#du").value }) });
    const j = await r.json();
    if (!r.ok) { $("#err").textContent = j.error || "Gabim"; $("#bk").disabled = false; return; }
    mine.push({ id: j.id, code: j.code }); ls.s("parkimi_mine", JSON.stringify(mine)); ls.s("parkimi_user", JSON.stringify({ n, p, v }));
    await load(); drawSheet();
  } catch (_) { $("#err").textContent = "Pa lidhje me serverin"; $("#bk").disabled = false; }
}
async function endMine(id) {
  const b = mine.find(x => x.id === id); if (!b) return;
  try { await fetch(`/api/booking/${id}/end`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: b.code }) }); } catch (_) {}
  mine = mine.filter(x => x.id !== id); ls.s("parkimi_mine", JSON.stringify(mine)); await load(); drawSheet();
}

/* ---------- printimi dhe admin ---------- */
function printView() {
  $("#pgrid").innerHTML = Object.keys(SECT).flatMap(s => [...SECT[s].top, ...SECT[s].bot]).map(k => `<div class="pc"><small>${SECT[k[0]].name}</small><b>${k.split("-")[1]}</b><div class="qr">${qr(url(k))}</div><small>Skano për të parkuar</small></div>`).join("");
}
const dt = t => new Intl.DateTimeFormat("sq-AL", { dateStyle: "short", timeStyle: "short", timeZone: S.tz }).format(t);
async function loadAdmin() {
  const k = $("#ak").value || sessionStorage.getItem("parkimi_ak") || ""; $("#aerr").textContent = "";
  const r = await fetch("/api/admin/bookings", { headers: { "x-admin-key": k } }), j = await r.json();
  if (!r.ok) { $("#aerr").textContent = j.error || "Gabim"; return; }
  sessionStorage.setItem("parkimi_ak", k); adminRows = j.rows;
  $("#atbl").innerHTML = `<tr><th>ID</th><th>Vendi</th><th>Emri</th><th>Telefoni</th><th>Automjeti</th><th>Fillimi</th><th>Mbarimi</th><th>Statusi</th></tr>` +
    j.rows.map(b => `<tr><td>${b.id}</td><td>${b.spot}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${VEH[b.vehicle] || ""}</td><td>${dt(b.start_at)}</td><td>${dt(b.end_at)}</td><td>${b.status}</td></tr>`).join("");
}
function csv() {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const t = ["id,vendi,emri,telefoni,automjeti,fillimi,mbarimi,statusi", ...adminRows.map(b => [b.id, b.spot, b.name, b.phone, b.vehicle, dt(b.start_at), dt(b.end_at), b.status].map(q).join(","))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + t], { type: "text/csv" })); a.download = "parkimet.csv"; a.click();
}

/* ---------- ngarkimi dhe rruga ---------- */
async function load() {
  try {
    S = await (await fetch("/api/state")).json(); skew = S.now - Date.now();
    for (const k in S.spots) { const s = S.spots[k].status; if (prev[k] && prev[k] !== "occupied" && s === "occupied") mv[k] = { t: now() }; prev[k] = s; }
    const live = new Set(Object.values(S.spots).flatMap(o => o.slots.map(s => s.id)));
    mine = mine.filter(b => live.has(b.id)); ls.s("parkimi_mine", JSON.stringify(mine));
    render(); if (cur && !$("#bk")) drawSheet();
  } catch (_) { $("#hrs").textContent = "Pa lidhje me serverin"; }
}
function route() {
  const h = location.hash.slice(1), v = h === "print" || h === "admin" ? h : "lot";
  ["lot", "print", "admin"].forEach(x => $("#v-" + x).hidden = x !== v);
  if (!S) return;
  if (v === "print") printView();
  if (/^[AB]-P\d+$/.test(h) && S.spots[h]) { sect = h[0]; render(); openSheet(h); }
}
window.onhashchange = route;
load().then(() => { route(); setInterval(load, 5000); });
</script>
</body>

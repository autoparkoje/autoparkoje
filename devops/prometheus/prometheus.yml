# Prometheus — monitorim VETËM lokal (ekspozohet në 127.0.0.1:9090).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: parkimi-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
